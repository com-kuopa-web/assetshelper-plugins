# 发布 FFmpeg 组件（各平台）到 GitHub Release，并自动更新 plugin-catalog.json
#
# 触发：推送 tag（如 ffmpeg-7.1.5）或手动运行（填版本号）
# 产物：official.ffmpeg-<version>-<platform>-<arch>.zip + 更新后的清单
#
# 关键约定：
# · 源码一律来自 **ffmpeg.org 官方发布包**（官方只提供源码；其预编译链接都是第三方，多为 GPL 构建）；
# · 三个平台都 **自建**：macOS / Linux 在本机 shell，Windows 在 MSYS2（MINGW64）；
# · 构建脚本默认是"最小构建"（不链接任何外部库，只用自带编解码器 + 硬件编码），依赖少、编译快；
# · 打包一律 `--require-lgpl`：GPL / nonfree 构建会让 CI 直接失败，防止把不合规二进制发出去。
#
# ── action 版本策略（重要，别随手改）────────────────────────────────────────────
# 背景：GitHub 会逐个淘汰 action 运行时的 Node 版本。**Node 20 已于 2026-09-23 从 runner 移除**，
#       届时仍声明 node20 的 action 会被"强行用 node24 跑"，并在日志里报弃用警告：
#         "The following actions target Node.js 20 but are being forced to run on Node.js 24: …"
#       警告本身不致命，但一旦某个 action 与 node24 不兼容就会真炸 —— 所以要主动升级。
#
# 选版规则：**取"最低的那个已用 node24 的 major"**，而不是无脑升到最新。
#   理由①：大版本跳得越多，未读的 breaking change 越多 —— 而 `action.yml` 只告诉你
#          **运行时**和**输入/输出清单**，不告诉你行为变了什么（见下方 checkout 实例）。
#   理由②：下载/上传制品两个 action 的 major **必须配对**（同一代制品 API），
#          所以 download 被逼到 v7 时，upload 也一起上 v7。
#
# ⚠️ checkout 为什么只到 v5、不跟到 v7（已查 CHANGELOG，不是"懒得看"）：
#   v5.0.0  = "Update actions checkout to use node 24"      → **纯运行时替换，行为与 v4 一致** ✅
#   v6.0.0  = "Persist creds to a separate file"            → ⚠️ 改了**凭据持久化的存放位置**
#   v7.0.0  = 默认拒绝为 pull_request_target/workflow_run 检出 fork PR → ⚠️ 安全加固（行为默认值反转）
#   本 workflow 的 release job **末尾要 `git push` 回写清单**，正好依赖 checkout 持久化的凭据
#   （也是当初 detached HEAD 会失败的原因）→ 动凭据机制的 major 不顺手跟，等有明确需要再单独验。
#
# 当前版本与自查结论（2026-09-25 逐个核对 `runs.using`）：
#   actions/checkout@v5          → node24 ✓   （v5 是"最低 node24"；v6/v7 见上方⚠️）
#   actions/setup-node@v5        → node24 ✓   （最新已到 v7）
#   actions/upload-artifact@v7   → node24 ✓   （实测 v5/node20、v6/node24；因需与 download 同代，取 v7）
#   actions/download-artifact@v7 → node24 ✓   （实测 v6 仍 node20，**没有**更低的 node24 可用）
#   softprops/action-gh-release@v3 → node24 ✓ （v2 是上一代）
#   msys2/setup-msys2@v2         → node24 ✓   （本来就已升级，无需动）
#
# 以后怎么查（一条命令看清某个 tag 声明的运行时）：
#   curl -s https://raw.githubusercontent.com/<owner>/<repo>/<tag>/action.yml | grep -A2 '^runs:'
# 想列出所有可用 major：
#   curl -s https://api.github.com/repos/<owner>/<repo>/tags | grep -o '"name":"v[0-9]*"' | head
# 想知道跨大版本到底改了什么（权威）：
#   curl -s https://raw.githubusercontent.com/<owner>/<repo>/main/CHANGELOG.md | head -40
# ⚠️ 别只升级日志里点名的那几个：没用到的 action 不会出现在警告里，
#    另一个 job（这里是 release）里的 action 要自己看一遍。
name: Release FFmpeg component

on:
  push:
    tags: ['ffmpeg-*']
  workflow_dispatch:
    inputs:
      version:
        description: 'FFmpeg 版本（官方发布号，如 7.1.5 / 8.1.3）'
        required: true
        default: '7.1.5'
      full:
        description: 'FULL 构建（额外链接 lame/opus/ass/freetype）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ⚠️ runner 标签会被 GitHub 退役：macos-13(Intel) 已于 2025 年下线，
          #    继续用它只会「Waiting for a runner to pick up this job...」永久排队。
          #    当前可用（2026-09）：
          #      macos-15 / macos-14        → arm64（Apple Silicon，标准 runner）
          #      macos-15-intel             → x64（Intel，标准 runner）★ 原 macos-13 的替代
          #      macos-14-large / -xlarge   → larger runner（计费不同）
          #    标签一旦再变，改下面两行即可（作业名里带 platform/arch，产物文件名不受影响）。
          - os: macos-15          # arm64（Apple Silicon）
            platform: darwin
            arch: arm64
          - os: macos-15-intel    # x64（Intel）—— 原 macos-13，2025 年退役后迁移到此标签
            platform: darwin
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64
            # ★ 只有这一格开 QSV（Intel 核显的硬解硬编，Windows 上最常见的可用硬件编码）。
            #   为什么要按格子开关而不是"Windows 就开"：`--enable-libvpl` 会让产物**依赖
            #   oneVPL 的运行库**（不再是单文件），于是打包必须把 DLL 一起收进去。
            #   这是一次有意识的取舍，不是一个可以顺手打开的默认值。
            qsv: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        # Windows 上让 run 步骤默认走 MSYS2 的 MINGW64 shell（为了让构建脚本与 macOS/Linux 完全一致）
        # ⚠️ 代价：MSYS2 shell **看不到 Windows PATH**（node/npm/pwsh 等不可用）
        #    → 需要 node 的步骤必须显式写 `shell: bash` 或 `shell: pwsh`
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v5

      # Node 提前装好：后面的"脚本体检"与"打包"都要用 node
      # （Windows 上注意：MSYS2 shell 看不到 Windows PATH，所以这两步都显式指定 bash/pwsh）
      #
      # ⚠️ 这里有两个"Node 版本"，别混淆：
      #   · `uses: ...@v5` 里的 v5 = **action 自身**跑在哪个 Node（v5 → node24，见下）
      #   · `node-version: '24'` = 给**我们的构建脚本**装的 Node（与 action 运行时无关）
      #     2026-09-26 由 '20' 升上来：20 已 EOL，且它与其它 workflow（22）不一致
      - uses: actions/setup-node@v5
        with: { node-version: '24' }

      # ---------- 工具链 ----------
      - name: 工具链（Windows / MSYS2 MINGW64）
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            nasm
            pkgconf
            diffutils
            curl
            tar
            xz
            mingw-w64-x86_64-toolchain
      # ---------- 硬件编码头文件 ----------
      # NVENC / AMF 是**只要头文件 + 运行期 dlopen**，装不上也不该让整个构建失败
      # （产物仍可转码：VideoToolbox / QSV / 或用户换一份带 libx264 的），所以 continue-on-error。
      - name: 硬件编码头文件（Windows 可选：NVENC / AMF 的头文件）
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: pacman -S --needed --noconfirm mingw-w64-x86_64-ffnvcodec-headers mingw-w64-x86_64-amf-headers

      # ⚠️ oneVPL **不能** continue-on-error：它是这一格里 QSV 的前提。
      #    以前它跟上面挤在同一行、又带 continue-on-error，于是"装失败"只会留下一句
      #    `⚠️ 跳过 QSV`，最后照样产出一份**没有 QSV 的 QSV 版**发出去。
      #    现在这里装不上就直接红（build-lgpl-ffmpeg.sh 的预检与打包的 --require-qsv 还会各拦一道）。
      - name: oneVPL（Windows QSV 必需）
        if: matrix.qsv
        run: |
          pacman -S --needed --noconfirm mingw-w64-x86_64-onevpl
          echo "--- 装完先确认 pkg-config 看得到（否则后面必然失败，不如在这一步说清）---"
          pkg-config --modversion vpl

      - name: 依赖（macOS）
        if: startsWith(matrix.os, 'macos-')
        run: brew install nasm pkg-config
      - name: 依赖（Linux）
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y nasm pkg-config

      # ---------- 解析版本 ----------
      - name: 解析版本号
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#ffmpeg-}" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 脚本体检（防 "$VAR+中文" 之类的 UTF-8 locale 坑） ----------
      # ⚠️ 必须显式 shell：
      #   本 job 的 defaults 在 Windows 上把 run 默认交给 MSYS2（msys2 {0}），
      #   而 MSYS2 shell 默认 **不继承 Windows PATH**（setup-msys2 的 path-type=minimal），
      #   于是 actions/setup-node 装的 node 在 MSYS2 里 `command not found`（exit 127）。
      - name: 脚本体检
        shell: bash
        run: |
          node scripts/check-shell-expansions.mjs
          node scripts/check-node-paths.mjs

      # ---------- 自建（三平台同一脚本） ----------
      # ENABLE_QSV=1 在这条链上是**硬要求**：脚本会在下载源码之前就检查 oneVPL，
      # 编完还会核对产物里真的有 h264_qsv（见 build-lgpl-ffmpeg.sh 的「0) 预检」与「4b」）。
      - name: 自建 LGPL ffmpeg
        env:
          FULL: ${{ github.event.inputs.full == 'true' && '1' || '0' }}
          ENABLE_QSV: ${{ matrix.qsv && '1' || '0' }}
        run: bash scripts/build-lgpl-ffmpeg.sh "${{ steps.meta.outputs.version }}"

      # ---------- 打包（Windows 用系统 node，不依赖 MSYS2） ----------
      - name: 打包组件（macOS / Linux）
        if: matrix.os != 'windows-latest'
        run: |
          V="${{ steps.meta.outputs.version }}"
          # 与 Windows 那一步**同样的口径**（运行库清单可空；QSV 目前只有 Windows 开，
          # 但两边的写法保持一致，免得以后给某个平台开 QSV 时忘了把这几行补上）
          RT=()
          if [ -f .build/RUNTIME-FILES.txt ]; then
            while IFS= read -r n; do
              [ -n "$n" ] && RT+=(--runtime ".build/out/bin/$n")
            done < .build/RUNTIME-FILES.txt
          fi
          LIC=(--license licenses/COPYING.LGPLv2.1)
          [ -f licenses/oneVPL-LICENSE.txt ] && LIC+=(--license licenses/oneVPL-LICENSE.txt)
          node scripts/build-ffmpeg-plugin.mjs \
            --bin ".build/out/bin/ffmpeg" \
            ${LIC[@]+"${LIC[@]}"} ${RT[@]+"${RT[@]}"} \
            --version "$V" --out dist-plugins --require-lgpl
          mv dist-plugins/official.ffmpeg-$V.zip dist-plugins/official.ffmpeg-$V-${{ matrix.platform }}-${{ matrix.arch }}.zip
          ls -lh dist-plugins/*.zip
      - name: 打包组件（Windows）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $V = "${{ steps.meta.outputs.version }}"
          # 逐行读 build-lgpl-ffmpeg.sh 收集好的运行库清单（QSV 时是 oneVPL 的 DLL）。
          # 为什么由脚本给清单、而不是在这里写死 `libvpl-2.dll`：
          # 产物到底是"动态依赖"还是"静态链接进去了"，只有读二进制的导入表才知道 ——
          # 那个判断在构建脚本里用 objdump 做（见 4c），这里只负责传下去。
          $runtimeArgs = @()
          if (Test-Path .build/RUNTIME-FILES.txt) {
            foreach ($name in (Get-Content .build/RUNTIME-FILES.txt | Where-Object { $_.Trim() })) {
              $runtimeArgs += @('--runtime', ".build/out/bin/$($name.Trim())")
            }
          }
          # QSV 那格必须带 --require-qsv：它会让打包在"产物里没有 h264_qsv"时**直接失败**，
          # 而不是把一份没有 QSV 的包当成 QSV 版发出去。
          $qsvArgs = @()
          if ("${{ matrix.qsv }}" -eq "true") { $qsvArgs += '--require-qsv' }
          $licArgs = @('--license', 'licenses/COPYING.LGPLv2.1')
          if (Test-Path licenses/oneVPL-LICENSE.txt) {
            $licArgs += @('--license', 'licenses/oneVPL-LICENSE.txt')
          }
          Write-Host "运行库参数：$($runtimeArgs -join ' ') / QSV 闸门：$($qsvArgs -join ' ')"
          node scripts/build-ffmpeg-plugin.mjs `
            --bin ".build/out/bin/ffmpeg.exe" `
            @licArgs @runtimeArgs @qsvArgs `
            --version "$V" --out dist-plugins --require-lgpl
          Move-Item "dist-plugins/official.ffmpeg-$V.zip" "dist-plugins/official.ffmpeg-$V-${{ matrix.platform }}-${{ matrix.arch }}.zip" -Force
          Get-ChildItem dist-plugins/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist-plugins/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ⚠️ 必须显式 checkout 到分支：tag 触发的 run 默认是 **detached HEAD**，
      #    末尾的 `git push`（提交更新后的清单）会直接失败：fatal: You are not currently on a branch.
      #    清单文件住在 main 上，所以这里固定拉 main。
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - uses: actions/download-artifact@v7
        with: { path: dist-plugins, merge-multiple: true }

      - name: 解析版本号
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=ffmpeg-${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#ffmpeg-}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release 并上传组件包
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: FFmpeg component ${{ steps.meta.outputs.version }}
          files: dist-plugins/*.zip
          body: |
            FFmpeg ${{ steps.meta.outputs.version }}（**LGPL 构建**，来自 ffmpeg.org 官方源码自建）。
            供 AssetsHelper 在「设置 → 播放 → FFmpeg」中下载安装；每个包内含
            `licenses/`（LGPL 原文）与 `THIRD-PARTY-NOTICES.md`（版本、configure 行、源码获取方式、替换方法）。

      - name: 更新清单
        run: |
          node scripts/update-catalog.mjs \
            --dir dist-plugins \
            --catalog plugin-catalog.json \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.meta.outputs.tag }}"

          # 提交前先核对：清单里写的 sha256/size 与**刚构建出来的 zip** 是否一致。
          # 这里是最该失败的时刻 —— 一旦提交并 push，线上清单就指向了这份产物。
          # （`--url` 那个"回读 Release"的模式留给发布后手动跑：它要联网、要资产已经可下载。）
          node scripts/verify-release.mjs --dir dist-plugins --catalog plugin-catalog.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugin-catalog.json
          git commit -m "chore(catalog): ffmpeg ${{ steps.meta.outputs.version }}" || echo "清单无变化"
          git push
